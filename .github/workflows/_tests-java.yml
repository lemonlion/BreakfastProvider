name: 'Tests (Java)'

# Reusable workflow: runs one Java component-test framework module against the Dockerized
# Testcontainers backends and uploads its Kronikol4J HTML report. Twin of _tests.yml for the
# Spring Boot Java port under java/.

on:
  workflow_call:
    inputs:
      framework:
        description: 'Component-test framework module: junit5 | testng | cucumber | spock'
        required: true
        type: string
      report-artifact:
        description: 'Name of the uploaded report artifact'
        required: true
        type: string
    secrets:
      ORGANISATION_PAT:
        description: 'PAT used to check out the Kronikol4J repository'
        required: true

jobs:
  test:
    name: ${{ inputs.framework }}
    runs-on: ubuntu-24.04
    env:
      # docker-java advertises an old API version; pin a modern one for Testcontainers.
      DOCKER_API_VERSION: '1.43'
    steps:
      - name: Checkout Breakfast Provider
        uses: actions/checkout@v5

      - name: Checkout Kronikol4J
        uses: actions/checkout@v5
        with:
          repository: lemonlion/Kronikol4J
          ref: main
          token: ${{ secrets.ORGANISATION_PAT }}
          path: kronikol4j

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish Kronikol4J to mavenLocal
        working-directory: kronikol4j
        run: ./gradlew publishToMavenLocal -x test --no-daemon

      - name: Run ${{ inputs.framework }} component tests
        working-directory: java
        run: ./mvnw -pl tests/component-${{ inputs.framework }} -am verify -Dapi.version=1.43

      - name: Upload Kronikol4J report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report-artifact }}
          path: java/tests/component-${{ inputs.framework }}/target/Reports
          if-no-files-found: error
