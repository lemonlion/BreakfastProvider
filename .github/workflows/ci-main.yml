      - xunit-in-docker
      - xunit-external-sut
      - tunit-in-memory
      - tunit-in-docker
      - tunit-external-sut
      - nunit-in-memory
      - nunit-in-docker
      - nunit-external-sut
      - bddfy-in-memory
      - bddfy-in-docker
      - bddfy-external-sut
      - unit-tests
      - unit-tests-in-docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checks complete
        run: echo "Checks complete"

  publish-fakes:
    name: Publish fakes
    needs: [checks-complete]
    uses: ./.github/workflows/_publish-fakes.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit


  # ─── Cross-run history ─────────────────────────────
  # Folds every lane's History.run.json, which each lane saves as an artifact of its own, into the ledger on
  # the orphan branch `kronikol-history` that the lanes read before they run, through Kronikol's history action.
  # One line per run and lane; a run already recorded is skipped, so re-running this job is safe, and a push
  # that another run's push beat records again on the branch as it now is. The branch shares no history with
  # main, so fetching it costs nothing and it can never be merged into main by accident.
  history:
    name: Record the runs in the history ledger
    needs:
      - lightbdd-in-memory
      - reqnroll-in-memory
      - xunit-in-memory
      - tunit-in-memory
      - nunit-in-memory
      - bddfy-in-memory
      - lightbdd-in-docker
      - reqnroll-in-docker
      - xunit-in-docker
      - tunit-in-docker
      - nunit-in-docker
      - bddfy-in-docker
      - lightbdd-external-sut
      - reqnroll-external-sut
      - xunit-external-sut
      - tunit-external-sut
      - nunit-external-sut
      - bddfy-external-sut
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: lemonlion/Kronikol/templates/github-actions/kronikol-history/record@v4.0.0
        with:
          token: ${{ secrets.PUSH_SPECS_IN_CI_TOKEN != '' && secrets.PUSH_SPECS_IN_CI_TOKEN || github.token }}

  # ─── GitHub Pages ───────────────────────────────────────────────────────────

  deploy-pages:
    name: Deploy to GitHub Pages
    needs:
      - lightbdd-in-memory
      - reqnroll-in-memory
      - xunit-in-memory
      - tunit-in-memory
      - nunit-in-memory
      - bddfy-in-memory
      - lightbdd-in-docker
      - reqnroll-in-docker
      - xunit-in-docker
      - tunit-in-docker
      - nunit-in-docker
      - bddfy-in-docker
      - lightbdd-external-sut
      - reqnroll-external-sut
      - xunit-external-sut
      - tunit-external-sut
      - nunit-external-sut
      - bddfy-external-sut
      - unit-tests
      - unit-tests-in-docker
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            docs
            .github/pages
            .github/scripts
            src/BreakfastProvider.Api/Protos

      - name: Download LightBDD report
        uses: actions/download-artifact@v7
        with:
          name: lightbdd-in-memory-report
          path: site/reports/lightbdd

      - name: Download ReqNRoll report
        uses: actions/download-artifact@v7
        with:
          name: reqnroll-in-memory-report
          path: site/reports/reqnroll

      - name: Download xUnit report
        uses: actions/download-artifact@v7
        with:
          name: xunit-in-memory-report
          path: site/reports/xunit

      - name: Download TUnit report
        uses: actions/download-artifact@v7
        with:
          name: tunit-in-memory-report
          path: site/reports/tunit

      - name: Download NUnit report
        uses: actions/download-artifact@v7
        with:
          name: nunit-in-memory-report
          path: site/reports/nunit

      - name: Download BDDfy report
        uses: actions/download-artifact@v7
        with:
          name: bddfy-in-memory-report
          path: site/reports/bddfy

      # ─── Docker reports ───────────────────────────────────────────────────

      - name: Download LightBDD docker report
        uses: actions/download-artifact@v7
        with:
          name: lightbdd-in-docker-report
          path: site/reports/docker/lightbdd

      - name: Download ReqNRoll docker report
        uses: actions/download-artifact@v7
        with:
          name: reqnroll-in-docker-report
          path: site/reports/docker/reqnroll

      - name: Download xUnit docker report
        uses: actions/download-artifact@v7
        with:
          name: xunit-in-docker-report
          path: site/reports/docker/xunit

      - name: Download TUnit docker report
        uses: actions/download-artifact@v7
        with:
          name: tunit-in-docker-report
          path: site/reports/docker/tunit

      - name: Download NUnit docker report
        uses: actions/download-artifact@v7
        with:
          name: nunit-in-docker-report
          path: site/reports/docker/nunit

      - name: Download BDDfy docker report
        uses: actions/download-artifact@v7
        with:
          name: bddfy-in-docker-report
          path: site/reports/docker/bddfy

      # ─── Docker SUT reports ───────────────────────────────────────────────

      - name: Download LightBDD external SUT report
        uses: actions/download-artifact@v7
        with:
          name: lightbdd-external-sut-report
          path: site/reports/docker-sut/lightbdd

      - name: Download ReqNRoll external SUT report
        uses: actions/download-artifact@v7
        with:
          name: reqnroll-external-sut-report
          path: site/reports/docker-sut/reqnroll

      - name: Download xUnit external SUT report
        uses: actions/download-artifact@v7
        with:
          name: xunit-external-sut-report
          path: site/reports/docker-sut/xunit

      - name: Download TUnit external SUT report
        uses: actions/download-artifact@v7
        with:
          name: tunit-external-sut-report
          path: site/reports/docker-sut/tunit

      - name: Download NUnit external SUT report
        uses: actions/download-artifact@v7
        with:
          name: nunit-external-sut-report
          path: site/reports/docker-sut/nunit

      - name: Download BDDfy external SUT report
        uses: actions/download-artifact@v7
        with:
          name: bddfy-external-sut-report
          path: site/reports/docker-sut/bddfy

      # Every contract as a page and as the documents behind it, one click from the landing page and from its own
      # page: .github/pages/ holds the landing page and the UI shells, docs/ the contracts the tests committed. The
      # renderers are pinned; the script fails on a failed download. Builds locally too (see README, Contracts).
      - name: Build the landing page and the API pages
        run: bash .github/scripts/build-api-pages.sh site

      - name: Check that every contract link resolves
        run: python3 .github/scripts/check-site-links.py site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ─── Unit (emulator + conformance) ──────────────────────────────────────────

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/_tests.yml
    with:
      test-type: unit
      test-run-type: memory
      test-run-description: unit-tests
      csproj-path: ./tests/BreakfastProvider.Tests.Unit/BreakfastProvider.Tests.Unit.csproj
    secrets: inherit

  unit-tests-in-docker:
    # Runs the ClickHouse conformance suite against the real container as well as the emulator
    # (the docker lane exports CLICKHOUSE_CONFORMANCE_CONNECTION_STRING).
    name: Unit tests in docker
    uses: ./.github/workflows/_tests.yml
    with:
      test-type: unit
      test-run-type: docker
      test-run-description: unit-tests-in-docker
      csproj-path: ./tests/BreakfastProvider.Tests.Unit/BreakfastProvider.Tests.Unit.csproj
    secrets: inherit

