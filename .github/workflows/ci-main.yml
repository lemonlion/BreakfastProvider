name: 'CI: Main'
run-name: "Push To Main: ${{ github.event.head_commit.message }}"

on:
  workflow_dispatch:

  push:
    branches: ["main"]

  # A run a day keeps the cross-run history ledger accruing (flakiness needs earlier runs to read
  # against) and the published reports saying what the last runs said.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  checks: write
  actions: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    secrets: inherit


  # ─── LightBDD ───────────────────────────────────────────────────────────────

  lightbdd-in-memory:
    name: LightBDD in memory
    uses: ./.github/workflows/_tests.yml
