          - And the following muffin toppings:
          - When the muffins are prepared
          - Then the muffin batch should have 5 ingredients
            - Muffin steps response message status code should be Created
            - Response content is valid json should be true
            - Muffin steps response ingredients should have count '5'
          - And the muffin response should include 2 toppings
            - Muffin steps response toppings should have count '2'
          - And the muffin response should include baking information
            - Muffin steps response baking temperature should be greater than 0

      - Scenario: Muffins endpoint called with an invalid field should return a bad request response
        IsHappyPath: false
