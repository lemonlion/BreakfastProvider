            - Response content is valid json should be true
            - Post steps response recipe name should be 'Recipe-37b821e7b213410ca9a41b9518317374'
            - Post steps response note text should be "Remember to fold the batter gently to keep it fluffy."
            - Post steps response category should be "Technique"
            - Post steps response note id should not be null or empty

      - Scenario: Creating a note with missing note text should return bad request
        IsHappyPath: false
