Title: Breakfast Provider Specifications
Features:
  - Feature: Apple Cinnamon Muffins Creation
    Description:     /muffins - Creating apple cinnamon muffins with baking profiles and toppings
    Scenarios:
      - Scenario: A valid apple cinnamon muffin request should return a fresh batch
        IsHappyPath: true
        Steps:
          - Given a valid apple cinnamon muffin recipe with all ingredients
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
            - Flour steps response message status code should be OK
          - When the muffins are prepared
          - Then the muffin response should contain a valid batch with all ingredients
            - Muffin steps response message status code should be Created
            - Response content is valid json should be true
            - Muffin steps response ingredients should contain 'Milk'
            - Muffin steps response ingredients should contain 'Eggs'
            - Muffin steps response ingredients should contain 'Flour'
            - Muffin steps response ingredients should contain GrannySmithApples
            - Muffin steps response ingredients should contain CeylonCinnamon
            - Muffin steps response toppings should have count 1
            - Muffin steps response baking temperature should be DefaultTemperature
            - Muffin steps response baking duration should be DefaultDuration
          - And the cow service should have received a milk request for the muffins
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/milk" (and)(and) r.Method == HttpMethod.Get >

      - Scenario: Different muffin recipes should produce the expected batch
        IsHappyPath: false
        Steps:
          - Given a muffin recipe "Classic" with the following ingredients:
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
          - And with baking at 180 degrees for 25 minutes in a "Standard" pan
          - And the following muffin toppings:
          - When the muffins are prepared
          - Then the muffin batch should have 5 ingredients
            - Muffin steps response message status code should be Created
            - Response content is valid json should be true
            - Muffin steps response ingredients should have count '5'
          - And the muffin response should include 2 toppings
            - Muffin steps response toppings should have count '2'
          - And the muffin response should include baking information
            - Muffin steps response baking temperature should be greater than 0

      - Scenario: Different muffin recipes should produce the expected batch
        IsHappyPath: false
        Steps:
