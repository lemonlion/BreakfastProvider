Title: Breakfast Provider Specifications
Features:
  - Feature: Audit Log Retrieval
    Description:     /audit-logs - Retrieving audit log entries for order operations
    Scenarios:
      - Scenario: Creating an order should produce a retrievable audit log entry
        IsHappyPath: true
        Steps:
          - Given a pancake batch has been created
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
            - Flour steps response message status code should be OK
            - Pancake steps response message status code should be Created
            - Response content is valid json should be true
            - Pancake steps response should not be null
            - Pancake steps response batch id should not be empty
          - And an order has been created for the batch
            - Order steps response message status code should be Created
            - Response content is valid json should be true
            - Order steps response order id should not be empty
          - When the audit logs are retrieved
          - Then the audit log response should contain the order creation entry
            - Audit steps response message status code should be OK
            - Response content is valid json should be true
            - Audit steps response should contain < a => a.Action == AuditLogDefaults.CreatedAction (and)(and) a.EntityType == AuditLogDefaults.OrderEntityType (and)(and) a.Details.Contains('TestCustomer_7159305429545272878') >
          - And the cow service should have received a milk request
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/milk" (and)(and) r.Method == HttpMethod.Get >
          - And the kitchen service should have received a preparation request
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/prepare" (and)(and) r.Method == HttpMethod.Post >

