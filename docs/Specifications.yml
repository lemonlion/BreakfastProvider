  - Feature: Audit Log Filtering
    Description:     /audit-logs - Filtering audit logs by entity type and entity ID
    Scenarios:
      - Scenario: Audit logs should be filterable by entity id
        IsHappyPath: false
        Steps:
          - Given a pancake batch has been created
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
            - Flour steps response message status code should be OK
            - Pancake steps response message status code should be Created
            - Response content is valid json should be true
            - Pancake steps response should not be null
            - Pancake steps response batch id should not be empty
          - And an order has been created for the batch
            - Order steps response message status code should be Created
            - Response content is valid json should be true
            - Order steps response order id should not be empty
          - When audit logs are requested filtered by entity id
          - Then the audit log response should contain the specific order entry
            - Audit log response status code should be OK
            - Audit logs should contain < l => l.EntityId == '8f28ba97-6adc-425e-bdad-89b4a19cc990' >

      - Scenario: Audit logs should be filterable by entity type
        IsHappyPath: false
        Steps:
          - Given a pancake batch has been created
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
            - Flour steps response message status code should be OK
            - Pancake steps response message status code should be Created
            - Response content is valid json should be true
            - Pancake steps response should not be null
            - Pancake steps response batch id should not be empty
          - And an order has been created for the batch
            - Order steps response message status code should be Created
            - Response content is valid json should be true
            - Order steps response order id should not be empty
          - When audit logs are requested filtered by entity type
          - Then the audit log response should only contain order entries
            - Audit log response status code should be OK
            - Audit logs should only contain < l => l.EntityType == AuditLogDefaults.OrderEntityType >

      - Scenario: Audit logs should be returned in descending timestamp order
        IsHappyPath: false
        Steps:
          - Given a pancake batch has been created
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
            - Flour steps response message status code should be OK
            - Pancake steps response message status code should be Created
            - Response content is valid json should be true
            - Pancake steps response should not be null
            - Pancake steps response batch id should not be empty
          - And an order has been created for the batch
            - Order steps response message status code should be Created
            - Response content is valid json should be true
            - Order steps response order id should not be empty
          - When audit logs are requested filtered by entity type
          - Then the audit logs should be ordered by timestamp descending
            - Audit logs should not be null or empty
            - Audit logs should be in descending order < l => l.Timestamp >

      - Scenario: Filtering audit logs by a non-existent entity type should return an empty collection
        IsHappyPath: false
        Steps:
          - When audit logs are requested filtered by a non-existent entity type
          - Then the audit log response should be an empty collection
            - Audit log response status code should be OK
            - Audit logs from different time range should be empty

  - Feature: Audit Log Retrieval
    Description:     /audit-logs - Retrieving audit log entries for order operations
    Scenarios:
      - Scenario: Creating an order should produce a retrievable audit log entry
        IsHappyPath: true
        Steps:
          - Given a pancake batch has been created
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
            - Flour steps response message status code should be OK
            - Pancake steps response message status code should be Created
            - Response content is valid json should be true
            - Pancake steps response should not be null
            - Pancake steps response batch id should not be empty
          - And an order has been created for the batch
            - Order steps response message status code should be Created
            - Response content is valid json should be true
            - Order steps response order id should not be empty
          - When the audit logs are retrieved
          - Then the audit log response should contain the order creation entry
            - Audit steps response message status code should be OK
            - Response content is valid json should be true
            - Audit steps response should contain < a => a.Action == AuditLogDefaults.CreatedAction (and)(and) a.EntityType == AuditLogDefaults.OrderEntityType (and)(and) a.Details.Contains('TestCustomer_1178235368202461478') >
          - And the cow service should have received a milk request
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/milk" (and)(and) r.Method == HttpMethod.Get >
          - And the kitchen service should have received a preparation request
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/prepare" (and)(and) r.Method == HttpMethod.Post >

