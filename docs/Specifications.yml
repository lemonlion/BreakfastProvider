  - Feature: Waffles Creation Feature
    Description: /waffles - Creating waffles with ingredients and optional toppings
    Scenarios:
      - Scenario: A Valid Waffle Request Should Return A Fresh Batch
        IsHappyPath: true
        Labels:
          - Happy Path
        Steps:
          - GIVEN A valid waffle recipe with all ingredients
            - A valid request body
              - The body specifies milk
                - Milk is retrieved from the get milk endpoint
                - The milk response should be successful
                  - Milk steps response message status code should be OK
                - Retrieved milk is set on the body
              - The body specifies eggs
                - Eggs are retrieved from the get eggs endpoint
                - The eggs response should be successful
                  - Eggs steps response message status code should be OK
                - Retrieved eggs are set on the body
              - The body specifies flour
                - Flour is retrieved from the get flour endpoint
                - The flour response should be successful
                  - Flour steps response message status code should be OK
                - Retrieved flour is set on the body
              - The body specifies butter
          - WHEN The waffles are prepared
          - THEN The waffles response should contain a valid batch with all ingredients
            - The response http status should be created
              - Waffle steps response message status code should be Created
            - The response should be valid json
              - Response content is valid json should be true
            - The response ingredients should include milk
              - Waffle steps response ingredients should contain 'Some_Fresh_Milk'
            - The response ingredients should include eggs
              - Waffle steps response ingredients should contain 'Some_Eggs'
            - The response ingredients should include flour
              - Waffle steps response ingredients should contain 'Some_Flour'
            - The response ingredients should include butter
              - Waffle steps response ingredients should contain UnsaltedButter
          - AND The cow service should have received a milk request
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/milk" (and)(and) r.Method == HttpMethod.Get >

      - Scenario: A Waffle Request With More Toppings Than Allowed Should Return A Bad Request Response
        IsHappyPath: false
        Steps:
          - GIVEN The max toppings per item is "5"
          - AND A valid waffle recipe with all ingredients
            - A valid request body
              - The body specifies milk
                - Milk is retrieved from the get milk endpoint
                - The milk response should be successful
                  - Milk steps response message status code should be OK
                - Retrieved milk is set on the body
              - The body specifies eggs
                - Eggs are retrieved from the get eggs endpoint
                - The eggs response should be successful
                  - Eggs steps response message status code should be OK
                - Retrieved eggs are set on the body
              - The body specifies flour
                - Flour is retrieved from the get flour endpoint
                - The flour response should be successful
                  - Flour steps response message status code should be OK
                - Retrieved flour is set on the body
              - The body specifies butter
          - AND The request has more toppings than the configured limit
          - WHEN The waffles are prepared
          - THEN The waffles response should indicate too many toppings
            - The response http status should be bad request
              - Waffle steps response message status code should be BadRequest
            - The response should contain max toppings error
              - Waffle error response body should contain MaxToppingsExceeded

