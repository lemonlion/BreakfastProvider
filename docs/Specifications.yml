          - Then the note update response should indicate not found
            - Patch steps response message status code should be NotFound

      - Scenario: Updating an existing note should return the updated note
        IsHappyPath: false
        Steps:
          - Given a chef note exists
            - Post steps response message status code should be Created
            - Response content is valid json should be true
          - When the note is updated
          - Then the update response should contain the modified note
            - Patch steps response message status code should be OK
            - Response content is valid json should be true
            - Patch steps response note id should be '345375a8-b663-493c-94ef-157df94f5d9e'
            - Patch steps response note text should be "Updated = Use unsalted butter for better flavour control."
            - Patch steps response category should be "Ingredients"
            - Patch steps response updated at should not be null

  - Feature: Complete Order Lifecycle
    Description:     /orders - Complete order lifecycle from creation through to completion
    Scenarios:
      - Scenario: An order should progress through all status transitions to completion
        IsHappyPath: true
        Steps:
          - Given a pancake batch has been created
            - Milk steps response message status code should be OK
            - Eggs steps response message status code should be OK
            - Flour steps response message status code should be OK
            - Pancake steps response message status code should be Created
            - Response content is valid json should be true
            - Pancake steps response should not be null
            - Pancake steps response batch id should not be empty
          - And a breakfast order has been placed for the batch
            - Order steps response message status code should be Created
            - Response content is valid json should be true
          - When the order progresses through all statuses to completed
            - Patch steps response message status code should be OK
            - Patch steps response message status code should be OK
            - Patch steps response message status code should be OK
          - Then the completed order should be retrievable with all details
            - Get order steps response message status code should be OK
            - Response content is valid json should be true
            - Get order steps response order id should be '3c39ea12-0c53-452d-a353-a3137cb710ec'
            - Get order steps response status should be Completed
            - Get order steps response customer name should be 'LifecycleTestCustomer_5281469130392267985'
          - And an audit log entry should exist for the order
            - Audit steps response message status code should be OK
            - Response content is valid json should be true
            - Audit steps response should contain < a => a.Action == AuditLogDefaults.CreatedAction (and)(and) a.EntityType == AuditLogDefaults.OrderEntityType (and)(and) a.Details.Contains('LifecycleTestCustomer_5281469130392267985') >
          - And the cow service should have received a milk request
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/milk" (and)(and) r.Method == HttpMethod.Get >
          - And the kitchen service should have received a preparation request
            - Requests should contain < r => r.RequestUri.AbsolutePath == "/prepare" (and)(and) r.Method == HttpMethod.Post >

  - Feature: Correlation Id
    Description:     Cross-cutting - X-Correlation-Id header propagation across API responses
    Scenarios:
      - Scenario: A request with a correlation id should return the same id in the response
        IsHappyPath: true
        Steps:
          - Given a request with a known correlation id
          - When the request is sent to the menu endpoint
          - Then the response should contain the same correlation id
            - Response contains correlation id header should be true
            - First correlation id header value should be '244fb6c4-20c1-4391-894f-7bd8c715463b'

      - Scenario: A request without a correlation id should have one generated in the response
        IsHappyPath: false
        Steps:
          - When a request without a correlation id is sent to the menu endpoint
          - Then the response should contain a generated correlation id
            - Response contains correlation id header should be true
            - First correlation id header value should not be null or empty

