  id: SortEnumType @cost(weight: "10")
  "The batch's id, as returned by POST \/pancakes."
  batchId: SortEnumType @cost(weight: "10")
  "The recipe type; only pancake batches publish the event, so it is Pancakes."
  recipeType: SortEnumType @cost(weight: "10")
  "The batch's ingredients, comma-separated."
  ingredients: SortEnumType @cost(weight: "10")
  "When the batch was completed, in UTC."
  completedAt: SortEnumType @cost(weight: "10")
}

