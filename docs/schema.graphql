schema {
  query: ReportingQuery
}

"A completed pancake batch, from its batch-completed event on Google Cloud Pub\/Sub."
type BatchCompletionRecord {
  "The reporting database's key for the row."
  id: Int!
  "The batch's id, as returned by POST \/pancakes."
  batchId: UUID!
  "The recipe type; only pancake batches publish the event, so it is Pancakes."
  recipeType: String!
  "The batch's ingredients, comma-separated."
  ingredients: String!
  "When the batch was completed, in UTC."
  completedAt: DateTime!
}

"""
An equipment alert, from Azure Event Hub. Each pancake batch raises one: equipment Griddle, alert type
UsageCycleCompleted.
"""
type EquipmentAlert {
  "The reporting database's key for the row."
  id: Int!
  "The alert's id."
  alertId: UUID!
  "The id of the batch that raised the alert."
  batchId: UUID!
  "The equipment the alert is about, for example Griddle."
  equipmentName: String!
  "What happened, for example UsageCycleCompleted."
  alertType: String!
  "When the alert was raised, in UTC."
  alertedAt: DateTime!
}

"An ingredient delivery, from an IngredientDeliveryEvent that Azure Event Grid delivers."
type IngredientShipment {
  "The reporting database's key for the row."
  id: Int!
  "The delivery's id, as the event gives it."
  deliveryId: UUID!
  "The ingredient delivered."
  ingredientName: String!
  "How much was delivered, as the event states it."
  quantity: Decimal!
  "When the delivery arrived, as the event states it."
  deliveredAt: DateTime!
}

"How many recipe reports list one ingredient."
type IngredientUsage {
  "The ingredient, as the recipes name it; names that differ only in case count as one."
  ingredient: String!
  "How many recipe reports list it."
  count: Int!
}

"An order as the reporting database records it when the order is created."
type OrderSummary {
  "The reporting database's key for the row."
  id: Int!
  "The order's id, as returned by POST \/orders."
  orderId: UUID!
  "The customer the order is for."
  customerName: String!
  "How many items the order has."
  itemCount: Int!
  "The table the order is for, when it has one."
  tableNumber: Int
  "The order's status when it was recorded, Created. Later changes of status are not recorded here."
  status: String!
  "When the order was created, in UTC."
  createdAt: DateTime!
}

"The recipe of one pancake, waffle or muffin batch, as logged to Kafka."
type RecipeReport {
  "The reporting database's key for the row."
  id: Int!
  "The id of the batch the recipe was logged for; the recipe log event carries it as OrderId."
  orderId: UUID!
  "The recipe type: Pancakes, Waffles or AppleCinnamonMuffins."
  recipeType: String!
  "The batch's ingredients, comma-separated."
  ingredients: String!
  "The batch's toppings, comma-separated; empty when it has none."
  toppings: String!
  "When the recipe was logged, in UTC."
  loggedAt: DateTime!
}

"How many recipe reports one recipe type has."
type RecipeTypeCount {
  "The recipe type: Pancakes, Waffles or AppleCinnamonMuffins."
  recipeType: String!
  "How many recipe reports it has."
  count: Int!
}

"""
Reporting queries over the business-intelligence database, which the service fills from its own orders and batches
and from the events it consumes.
"""
type ReportingQuery {
  "One summary per order placed through POST \/orders, recorded when the order is created."
  orderSummaries(where: OrderSummaryFilterInput @cost(weight: "10") order: [OrderSummarySortInput!] @cost(weight: "10")): [OrderSummary!]! @cost(weight: "10")
  """
  One report per recipe logged: every pancake, waffle and muffin batch logs its recipe to Kafka, and the reporting
  consumer records it.
  """
  recipeReports(where: RecipeReportFilterInput @cost(weight: "10") order: [RecipeReportSortInput!] @cost(weight: "10")): [RecipeReport!]! @cost(weight: "10")
  "How many recipe reports list each ingredient, the most used first."
  ingredientUsage: [IngredientUsage!]! @cost(weight: "10")
  "How many recipe reports each recipe type has, the most popular first."
  popularRecipes: [RecipeTypeCount!]! @cost(weight: "10")
  "One record per completed pancake batch, from the batch-completed events on Google Cloud Pub\/Sub."
  batchCompletions(where: BatchCompletionRecordFilterInput @cost(weight: "10") order: [BatchCompletionRecordSortInput!] @cost(weight: "10")): [BatchCompletionRecord!]! @cost(weight: "10")
  """
  One record per ingredient delivery, from the IngredientDeliveryEvent that Azure Event Grid delivers to
  POST /webhooks/eventgrid.
  """
  ingredientShipments(where: IngredientShipmentFilterInput @cost(weight: "10") order: [IngredientShipmentSortInput!] @cost(weight: "10")): [IngredientShipment!]! @cost(weight: "10")
  "One record per equipment alert, from Azure Event Hub. Each pancake batch raises one for the griddle."
  equipmentAlerts(where: EquipmentAlertFilterInput @cost(weight: "10") order: [EquipmentAlertSortInput!] @cost(weight: "10")): [EquipmentAlert!]! @cost(weight: "10")
}

"A completed pancake batch, from its batch-completed event on Google Cloud Pub\/Sub."
input BatchCompletionRecordFilterInput {
  and: [BatchCompletionRecordFilterInput!]
  or: [BatchCompletionRecordFilterInput!]
  "The reporting database's key for the row."
  id: IntOperationFilterInput
  "The batch's id, as returned by POST \/pancakes."
  batchId: UuidOperationFilterInput
  "The recipe type; only pancake batches publish the event, so it is Pancakes."
  recipeType: StringOperationFilterInput
  "The batch's ingredients, comma-separated."
  ingredients: StringOperationFilterInput
  "When the batch was completed, in UTC."
  completedAt: DateTimeOperationFilterInput
}

